<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoteFolio — PDF-Style Note Manager</title>
    <style>
        /* ... (all CSS from previous version, unchanged) ... */
    </style>
</head>
<body>
    <!-- ... (all HTML structure, unchanged) ... -->

    <script>
        (function() {
            'use strict';

            // ═══════════════════════════════════════════
            //  CONSTANTS & STATE (same as before)
            // ═══════════════════════════════════════════
            const STORAGE_KEY = 'notefolio_data_v1';
            const MAX_SUBJECTS = 6;
            const DEFAULT_SUBJECTS = [
                { id: 'subj_1', name: 'Mathematics', color: '#4f6df5', icon: '📐' },
                { id: 'subj_2', name: 'Science', color: '#10b981', icon: '🔬' },
                { id: 'subj_3', name: 'History', color: '#f59e0b', icon: '📜' },
                { id: 'subj_4', name: 'Literature', color: '#8b5cf6', icon: '📚' },
                { id: 'subj_5', name: 'Art', color: '#ec4899', icon: '🎨' },
                { id: 'subj_6', name: 'Technology', color: '#06b6d4', icon: '💻' },
            ];
            const SUBJECT_COLORS = [
                '#4f6df5', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899',
                '#06b6d4', '#ef4444', '#f97316', '#84cc16', '#14b8a6',
                '#6366f1', '#a855f7', '#f43f5e', '#0ea5e9', '#22c55e'
            ];

            let state = {
                subjects: [],
                activeSubjectId: null,
                activeNoteId: null,
            };

            let saveTimeout = null;
            let isEditingColor = false;

            // DOM references (same)
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const sidebar = $('#sidebar');
            const sidebarToggle = $('#sidebarToggle');
            const sidebarBackdrop = $('#sidebarBackdrop');
            const subjectsList = $('#subjectsList');
            const notesList = $('#notesList');
            const addNoteBtn = $('#addNoteBtn');
            const editor = $('#editor');
            const paper = $('#paper');
            const pageFooterTitle = $('#pageFooterTitle');
            const pageFooterDate = $('#pageFooterDate');
            const saveIndicator = $('#saveIndicator');
            const formatBlock = $('#formatBlock');
            const textColorBtn = $('#textColorBtn');
            const textColorSwatches = $('#textColorSwatches');
            const highlightBtn = $('#highlightBtn');
            const highlightSwatches = $('#highlightSwatches');
            const insertImageBtn = $('#insertImageBtn');
            const imageFileInput = $('#imageFileInput');
            const dropFileInput = $('#dropFileInput');
            const newNoteModal = $('#newNoteModal');
            const newNoteTitleInput = $('#newNoteTitle');
            const cancelNewNoteBtn = $('#cancelNewNote');
            const confirmNewNoteBtn = $('#confirmNewNote');
            const editSubjectModal = $('#editSubjectModal');
            const editSubjectNameInput = $('#editSubjectName');
            const subjectColorOptions = $('#subjectColorOptions');
            const cancelEditSubjectBtn = $('#cancelEditSubject');
            const confirmEditSubjectBtn = $('#confirmEditSubject');
            const printBtn = $('#printBtn');
            const editorScrollArea = $('#editorScrollArea');

            let editingSubjectId = null;
            let selectedSubjectColor = SUBJECT_COLORS[0];

            // ═══════════════════════════════════════════
            //  STORAGE (unchanged)
            // ═══════════════════════════════════════════
            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && Array.isArray(parsed.subjects) && parsed.subjects.length > 0) {
                            state.subjects = parsed.subjects;
                            state.activeSubjectId = parsed.activeSubjectId || state.subjects[0].id;
                            state.activeNoteId = parsed.activeNoteId || null;
                            return;
                        }
                    }
                } catch (e) {
                    console.warn('Failed to load state, using defaults.', e);
                }
                state.subjects = JSON.parse(JSON.stringify(DEFAULT_SUBJECTS));
                state.activeSubjectId = state.subjects[0].id;
                state.activeNoteId = null;
                saveState();
            }

            function saveState() {
                try {
                    const data = {
                        subjects: state.subjects,
                        activeSubjectId: state.activeSubjectId,
                        activeNoteId: state.activeNoteId,
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    showSaveIndicator();
                } catch (e) {
                    console.error('Failed to save state:', e);
                    if (e.name === 'QuotaExceededError') {
                        alert('Storage is full. Try removing some large images or notes.');
                    }
                }
            }

            function scheduleSave() {
                if (saveTimeout) clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => saveState(), 300);
            }

            function showSaveIndicator() {
                saveIndicator.classList.add('visible');
                setTimeout(() => saveIndicator.classList.remove('visible'), 1200);
            }

            // ═══════════════════════════════════════════
            //  UTILITY (unchanged)
            // ═══════════════════════════════════════════
            function generateId() {
                return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 7);
            }

            function getActiveSubject() {
                return state.subjects.find(s => s.id === state.activeSubjectId) || state.subjects[0] || null;
            }

            function getActiveNote() {
                const subject = getActiveSubject();
                if (!subject) return null;
                return subject.notes?.find(n => n.id === state.activeNoteId) || null;
            }

            function stripHtml(html) {
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || '';
            }

            function formatDate(ts) {
                if (!ts) return '—';
                const d = new Date(ts);
                return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            }

            function truncate(str, len) {
                if (!str) return '';
                return str.length > len ? str.substr(0, len) + '…' : str;
            }

            // ═══════════════════════════════════════════
            //  RENDER: SUBJECTS (unchanged)
            // ═══════════════════════════════════════════
            function renderSubjects() {
                subjectsList.innerHTML = '';
                state.subjects.forEach(subj => {
                    const noteCount = subj.notes ? subj.notes.length : 0;
                    const div = document.createElement('div');
                    div.className = 'subject-item' + (subj.id === state.activeSubjectId ? ' active' : '');
                    div.dataset.subjectId = subj.id;
                    div.innerHTML = `
                        <span class="subject-dot" style="background:${subj.color};"></span>
                        <span class="subject-name">${subj.icon || '📄'} ${escapeHtml(subj.name)}</span>
                        <span class="subject-count">${noteCount}</span>
                        <button class="subject-edit-btn" data-edit-subject="${subj.id}" title="Edit subject">✎</button>
                    `;
                    div.addEventListener('click', (e) => {
                        if (e.target.closest('.subject-edit-btn')) return;
                        selectSubject(subj.id);
                    });
                    const editBtn = div.querySelector('.subject-edit-btn');
                    editBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openEditSubjectModal(subj.id);
                    });
                    subjectsList.appendChild(div);
                });
            }

            function escapeHtml(str) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return str.replace(/[&<>"']/g, c => map[c]);
            }

            function selectSubject(subjectId) {
                state.activeSubjectId = subjectId;
                const subject = getActiveSubject();
                state.activeNoteId = subject?.notes && subject.notes.length > 0 ? subject.notes[0].id : null;
                renderSubjects();
                renderNotesList();
                loadActiveNote();
                scheduleSave();
                if (window.innerWidth <= 768) closeSidebar();
            }

            // ═══════════════════════════════════════════
            //  RENDER: NOTES LIST (unchanged)
            // ═══════════════════════════════════════════
            function renderNotesList() {
                notesList.innerHTML = '';
                const subject = getActiveSubject();
                if (!subject) {
                    notesList.innerHTML = '<div class="empty-notes"><div class="icon">📄</div>No subject selected</div>';
                    return;
                }
                const notes = subject.notes || [];
                if (notes.length === 0) {
                    notesList.innerHTML = '<div class="empty-notes"><div class="icon">📝</div>No notes yet. Click + to create one.</div>';
                    return;
                }
                notes.forEach(note => {
                    const div = document.createElement('div');
                    div.className = 'note-item' + (note.id === state.activeNoteId ? ' active' : '');
                    div.dataset.noteId = note.id;
                    const preview = truncate(stripHtml(note.content || ''), 50) || 'Empty note';
                    div.innerHTML = `
                        <span class="note-icon">📄</span>
                        <div class="note-info">
                            <div class="note-title">${escapeHtml(note.title || 'Untitled')}</div>
                            <div class="note-preview">${escapeHtml(preview)}</div>
                        </div>
                        <button class="note-delete-btn" data-delete-note="${note.id}" title="Delete note">🗑</button>
                    `;
                    div.addEventListener('click', (e) => {
                        if (e.target.closest('.note-delete-btn')) return;
                        selectNote(note.id);
                    });
                    const delBtn = div.querySelector('.note-delete-btn');
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteNote(note.id);
                    });
                    notesList.appendChild(div);
                });
            }

            function selectNote(noteId) {
                state.activeNoteId = noteId;
                renderNotesList();
                loadActiveNote();
                scheduleSave();
                if (window.innerWidth <= 768) closeSidebar();
            }

            function deleteNote(noteId) {
                const subject = getActiveSubject();
                if (!subject) return;
                if (!confirm('Delete this note? This cannot be undone.')) return;
                subject.notes = (subject.notes || []).filter(n => n.id !== noteId);
                if (state.activeNoteId === noteId) {
                    state.activeNoteId = subject.notes.length > 0 ? subject.notes[0].id : null;
                }
                renderSubjects();
                renderNotesList();
                loadActiveNote();
                scheduleSave();
            }

            // ═══════════════════════════════════════════
            //  LOAD NOTE INTO EDITOR (modified)
            // ═══════════════════════════════════════════
            function loadActiveNote() {
                const note = getActiveNote();
                if (note) {
                    editor.innerHTML = note.content || '';
                    pageFooterTitle.textContent = note.title || 'Untitled';
                    pageFooterDate.textContent = formatDate(note.updatedAt || note.createdAt);
                    editor.setAttribute('data-placeholder', 'Start typing your note…');
                } else {
                    editor.innerHTML = '';
                    pageFooterTitle.textContent = '—';
                    pageFooterDate.textContent = '—';
                    editor.setAttribute('data-placeholder', 'Click to start typing — a note will be created automatically.');
                }
                // Always editable
                editor.setAttribute('contenteditable', 'true');
            }

            // Helper: create a new note if none exists
            function ensureActiveNote() {
                const subject = getActiveSubject();
                if (!subject) return null;
                if (!subject.notes) subject.notes = [];
                if (!state.activeNoteId || !subject.notes.some(n => n.id === state.activeNoteId)) {
                    // Create a new note
                    const note = {
                        id: generateId(),
                        title: 'Untitled note',
                        content: '',
                        createdAt: Date.now(),
                        updatedAt: Date.now(),
                    };
                    subject.notes.unshift(note);
                    state.activeNoteId = note.id;
                    renderSubjects();
                    renderNotesList();
                    loadActiveNote();
                    scheduleSave();
                }
                return getActiveNote();
            }

            // ═══════════════════════════════════════════
            //  EDITOR EVENTS (modified)
            // ═══════════════════════════════════════════
            editor.addEventListener('input', () => {
                // Auto-create note if none exists
                const note = ensureActiveNote();
                if (!note) return;
                note.content = editor.innerHTML;
                note.updatedAt = Date.now();
                pageFooterTitle.textContent = note.title || 'Untitled';
                pageFooterDate.textContent = formatDate(note.updatedAt);
                scheduleSave();
                renderNotesList(); // update preview
            });

            editor.addEventListener('keydown', (e) => {
                const note = getActiveNote();
                if (!note) return; // but we'll create on input anyway
                if (e.ctrlKey || e.metaKey) {
                    const key = e.key.toLowerCase();
                    if (key === 'b') { e.preventDefault(); document.execCommand('bold'); }
                    if (key === 'i') { e.preventDefault(); document.execCommand('italic'); }
                    if (key === 'u') { e.preventDefault(); document.execCommand('underline'); }
                    if (key === 's') { e.preventDefault(); saveState(); }
                }
            });

            editor.addEventListener('paste', (e) => {
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text/plain');
                document.execCommand('insertText', false, text);
            });

            // ═══════════════════════════════════════════
            //  TOOLBAR (unchanged mostly)
            // ═══════════════════════════════════════════
            formatBlock.addEventListener('change', () => {
                const value = formatBlock.value;
                if (value === 'pre') {
                    document.execCommand('formatBlock', false, 'pre');
                } else {
                    document.execCommand('formatBlock', false, value);
                }
                editor.focus();
                updateNoteContent();
            });

            document.querySelectorAll('[data-command]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cmd = btn.dataset.command;
                    document.execCommand(cmd, false, null);
                    editor.focus();
                    updateToolbarActiveStates();
                    updateNoteContent();
                });
            });

            function updateToolbarActiveStates() {
                document.querySelectorAll('[data-command]').forEach(btn => {
                    const cmd = btn.dataset.command;
                    try {
                        const isActive = document.queryCommandState(cmd);
                        btn.classList.toggle('active', isActive);
                    } catch (e) { /* ignore */ }
                });
                try {
                    const block = document.queryCommandValue('formatBlock') || 'p';
                    const val = block === 'pre' ? 'pre' : block;
                    if (['p', 'h1', 'h2', 'h3', 'blockquote', 'pre'].includes(val)) {
                        formatBlock.value = val;
                    }
                } catch (e) { /* ignore */ }
            }

            editor.addEventListener('mouseup', updateToolbarActiveStates);
            editor.addEventListener('keyup', updateToolbarActiveStates);
            editor.addEventListener('focus', updateToolbarActiveStates);

            // ─── Color pickers (unchanged) ───
            function toggleSwatches(swatchesEl, otherSwatchesEl) {
                const isVisible = swatchesEl.classList.contains('visible');
                document.querySelectorAll('.color-swatches').forEach(el => el.classList.remove('visible'));
                if (!isVisible) swatchesEl.classList.add('visible');
            }

            textColorBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleSwatches(textColorSwatches, highlightSwatches);
            });

            highlightBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleSwatches(highlightSwatches, textColorSwatches);
            });

            document.addEventListener('click', () => {
                document.querySelectorAll('.color-swatches').forEach(el => el.classList.remove('visible'));
            });

            document.querySelectorAll('.color-swatches').forEach(el => {
                el.addEventListener('click', (e) => e.stopPropagation());
            });

            textColorSwatches.querySelectorAll('.color-swatch').forEach(swatch => {
                swatch.addEventListener('click', () => {
                    const color = swatch.dataset.color;
                    document.execCommand('foreColor', false, color);
                    editor.focus();
                    textColorSwatches.classList.remove('visible');
                    updateNoteContent();
                });
            });
            $('#customTextColor').addEventListener('input', (e) => {
                document.execCommand('foreColor', false, e.target.value);
            });
            highlightSwatches.querySelectorAll('.color-swatch').forEach(swatch => {
                swatch.addEventListener('click', () => {
                    const color = swatch.dataset.color;
                    if (color === 'transparent') {
                        document.execCommand('hiliteColor', false, 'transparent');
                        document.execCommand('backColor', false, 'transparent');
                    } else {
                        document.execCommand('hiliteColor', false, color);
                    }
                    editor.focus();
                    highlightSwatches.classList.remove('visible');
                    updateNoteContent();
                });
            });

            function updateNoteContent() {
                const note = ensureActiveNote(); // auto-create if needed
                if (note) {
                    note.content = editor.innerHTML;
                    note.updatedAt = Date.now();
                    pageFooterDate.textContent = formatDate(note.updatedAt);
                    scheduleSave();
                    renderNotesList();
                }
            }

            // ─── Image insertion (modified) ───
            insertImageBtn.addEventListener('click', () => {
                // Auto-create note if needed
                ensureActiveNote();
                imageFileInput.click();
            });

            imageFileInput.addEventListener('change', () => {
                const file = imageFileInput.files[0];
                if (file) insertImageFile(file);
                imageFileInput.value = '';
            });

            editorScrollArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                editorScrollArea.style.backgroundColor = '#f0f4ff';
            });
            editorScrollArea.addEventListener('dragleave', (e) => {
                e.preventDefault();
                editorScrollArea.style.backgroundColor = '';
            });
            editorScrollArea.addEventListener('drop', (e) => {
                e.preventDefault();
                editorScrollArea.style.backgroundColor = '';
                const files = e.dataTransfer.files;
                if (files.length > 0 && files[0].type.startsWith('image/')) {
                    ensureActiveNote();
                    insertImageFile(files[0]);
                }
            });

            function insertImageFile(file) {
                if (file.size > 2 * 1024 * 1024) {
                    alert('Image is too large. Please choose an image under 2MB.');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const imgSrc = e.target.result;
                    editor.focus();
                    const sel = window.getSelection();
                    let range;
                    if (sel.rangeCount > 0) {
                        range = sel.getRangeAt(0);
                    } else {
                        range = document.createRange();
                        range.selectNodeContents(editor);
                        range.collapse(false);
                    }
                    const img = document.createElement('img');
                    img.src = imgSrc;
                    img.alt = 'Embedded image';
                    img.style.maxWidth = '100%';
                    range.deleteContents();
                    range.insertNode(img);
                    range.setStartAfter(img);
                    range.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(range);
                    updateNoteContent();
                };
                reader.readAsDataURL(file);
            }

            // ─── Image resize on double-click (unchanged) ───
            editor.addEventListener('dblclick', (e) => {
                const target = e.target;
                if (target.tagName === 'IMG') {
                    const newWidth = prompt('Enter image width (e.g., 100%, 300px, 50%):', target.style.width || '100%');
                    if (newWidth !== null) {
                        target.style.width = newWidth;
                        updateNoteContent();
                    }
                }
            });

            // ═══════════════════════════════════════════
            //  NEW NOTE (unchanged)
            // ═══════════════════════════════════════════
            addNoteBtn.addEventListener('click', () => {
                if (!getActiveSubject()) {
                    alert('No subject selected.');
                    return;
                }
                newNoteModal.classList.add('visible');
                newNoteTitleInput.value = '';
                newNoteTitleInput.focus();
            });

            cancelNewNoteBtn.addEventListener('click', () => {
                newNoteModal.classList.remove('visible');
            });

            confirmNewNoteBtn.addEventListener('click', () => {
                const subject = getActiveSubject();
                if (!subject) return;
                const title = newNoteTitleInput.value.trim() || 'Untitled note';
                const note = {
                    id: generateId(),
                    title: title,
                    content: '',
                    createdAt: Date.now(),
                    updatedAt: Date.now(),
                };
                if (!subject.notes) subject.notes = [];
                subject.notes.unshift(note);
                state.activeNoteId = note.id;
                newNoteModal.classList.remove('visible');
                renderSubjects();
                renderNotesList();
                loadActiveNote();
                scheduleSave();
                editor.focus();
            });

            newNoteTitleInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    confirmNewNoteBtn.click();
                }
            });

            newNoteModal.addEventListener('click', (e) => {
                if (e.target === newNoteModal) newNoteModal.classList.remove('visible');
            });
            editSubjectModal.addEventListener('click', (e) => {
                if (e.target === editSubjectModal) editSubjectModal.classList.remove('visible');
            });

            // ═══════════════════════════════════════════
            //  EDIT SUBJECT (unchanged)
            // ═══════════════════════════════════════════
            function openEditSubjectModal(subjectId) {
                const subject = state.subjects.find(s => s.id === subjectId);
                if (!subject) return;
                editingSubjectId = subjectId;
                selectedSubjectColor = subject.color || SUBJECT_COLORS[0];
                editSubjectNameInput.value = subject.name;
                renderSubjectColorOptions();
                editSubjectModal.classList.add('visible');
                editSubjectNameInput.focus();
            }

            function renderSubjectColorOptions() {
                subjectColorOptions.innerHTML = '';
                SUBJECT_COLORS.forEach(color => {
                    const div = document.createElement('div');
                    div.className = 'color-option' + (color === selectedSubjectColor ? ' selected' : '');
                    div.style.background = color;
                    div.dataset.color = color;
                    div.addEventListener('click', () => {
                        selectedSubjectColor = color;
                        renderSubjectColorOptions();
                    });
                    subjectColorOptions.appendChild(div);
                });
            }

            cancelEditSubjectBtn.addEventListener('click', () => {
                editSubjectModal.classList.remove('visible');
                editingSubjectId = null;
            });

            confirmEditSubjectBtn.addEventListener('click', () => {
                if (!editingSubjectId) return;
                const subject = state.subjects.find(s => s.id === editingSubjectId);
                if (!subject) return;
                const name = editSubjectNameInput.value.trim();
                if (name) subject.name = name;
                subject.color = selectedSubjectColor;
                editSubjectModal.classList.remove('visible');
                editingSubjectId = null;
                renderSubjects();
                scheduleSave();
            });

            editSubjectNameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    confirmEditSubjectBtn.click();
                }
            });

            // ═══════════════════════════════════════════
            //  SIDEBAR TOGGLE (unchanged)
            // ═══════════════════════════════════════════
            function toggleSidebar() {
                if (window.innerWidth <= 768) {
                    sidebar.classList.toggle('hidden');
                    sidebarBackdrop.classList.toggle('visible', !sidebar.classList.contains('hidden'));
                } else {
                    sidebar.classList.toggle('hidden');
                }
            }

            function closeSidebar() {
                sidebar.classList.add('hidden');
                sidebarBackdrop.classList.remove('visible');
            }

            sidebarToggle.addEventListener('click', toggleSidebar);
            sidebarBackdrop.addEventListener('click', closeSidebar);

            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) {
                    sidebar.classList.remove('hidden');
                    sidebarBackdrop.classList.remove('visible');
                } else {
                    sidebar.classList.add('hidden');
                    sidebarBackdrop.classList.remove('visible');
                }
            });

            // ═══════════════════════════════════════════
            //  PRINT (unchanged)
            // ═══════════════════════════════════════════
            printBtn.addEventListener('click', () => {
                saveState();
                window.print();
            });

            // ═══════════════════════════════════════════
            //  INITIALIZATION (modified for auto note creation hint)
            // ═══════════════════════════════════════════
            function init() {
                loadState();
                state.subjects.forEach(s => { if (!s.notes) s.notes = []; });
                const activeSubject = getActiveSubject();
                if (!activeSubject && state.subjects.length > 0) {
                    state.activeSubjectId = state.subjects[0].id;
                }
                const subject = getActiveSubject();
                if (subject && state.activeNoteId) {
                    const noteExists = subject.notes?.some(n => n.id === state.activeNoteId);
                    if (!noteExists) {
                        state.activeNoteId = subject.notes?.length > 0 ? subject.notes[0].id : null;
                    }
                } else if (subject && subject.notes?.length > 0) {
                    state.activeNoteId = subject.notes[0].id;
                } else {
                    state.activeNoteId = null;
                }
                renderSubjects();
                renderNotesList();
                loadActiveNote();
                if (window.innerWidth <= 768) {
                    sidebar.classList.add('hidden');
                    sidebarBackdrop.classList.remove('visible');
                }
                // Make sure editor is always editable and clickable
                editor.setAttribute('contenteditable', 'true');
                paper.addEventListener('click', (e) => {
                    if (e.target === paper || e.target === editor) {
                        editor.focus();
                    }
                });
                scheduleSave();
            }

            init();
        })();
    </script>
</body>
</html>
